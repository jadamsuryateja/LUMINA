<div style="font-family: 'Inter', sans-serif; background-color: #0b0d17; color: #f8f9fa; padding: 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); max-width: 600px; margin: 0 auto;">
  <!-- LinkedIn-Style Rectangle Banner -->
  <div style="width: 100%; height: 180px; overflow: hidden; border-radius: 15px; margin-bottom: 30px;">
    <img src="https://lumina-one-gold.vercel.app/assets/hero2-ZgHNjT64.png" alt="Lumina Creative" style="width: 100%; height: 100%; object-fit: cover; display: block;">
  </div>
  
  <div style="text-transform: uppercase; letter-spacing: 2px;">
    <h2 style="color: #00f5ff; margin-bottom: 20px; font-size: 20px;">NEW TRANSMISSION RECEIVED</h2>
    <p style="font-size: 13px; color: #cbd5e1; margin-bottom: 30px;">
      A MESSAGE BY <strong style="color: #ffffff;">{{name}}</strong> HAS BEEN RECEIVED. 
      KINDLY RESPOND AT YOUR EARLIEST CONVENIENCE.
    </p>
    
    <div style="background: rgba(45, 45, 75, 0.3); padding: 25px; border-radius: 15px; border-left: 4px solid #6c63ff;">
      <div style="font-size: 11px; color: #6c63ff; margin-bottom: 10px; font-weight: bold;">TIMESTAMP: {{time}}</div>
      <p style="font-size: 16px; line-height: 1.6; margin: 0; color: #ffffff;">
        {{message}}
      </p>
    </div>
    
    <div style="margin-top: 40px; text-align: center; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
      <p style="font-size: 10px; color: #cbd5e1; letter-spacing: 1px;">LUMINA CREATIVE DIGITAL AGENCY // SYSTEM_AUTO_REPLY</p>
    </div>
  </div>
</div>
